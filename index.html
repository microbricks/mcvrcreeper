<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MCVRCREEPER OS v1.1</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020a02;color:#55ff55;font-family:'Press Start 2P',monospace;overflow:hidden;height:100vh;width:100vw}
#os{position:relative;width:100%;height:100%;background:radial-gradient(circle at 50% 50%, #0a2a0a 0%, #020a02 80%);transform-style:preserve-3d;transition:transform 0.1s linear}
.topbar{display:flex;justify-content:space-between;padding:12px 15px;font-size:7px;border-bottom:2px solid #55ff55;background:rgba(0,0,0,0.9)}
.app-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:30px 20px;max-width:400px;margin:20px auto;transform:translateZ(50px)}
.app{flex-direction:column;align-items:center;cursor:pointer;display:flex;transition:0.2s}
.app-icon{width:75px;height:75px;background:#111;border:2px solid #55ff55;box-shadow:0 0 20px #55ff55, 5px 5px 0 #000;display:flex;align-items:center;justify-content:center;font-size:32px}
.app-label{font-size:6px;margin-top:8px;text-align:center;color:#aaffaa}
#enableGyro{position:fixed;inset:0;background:#020a02;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
#enableGyro h1{font-size:14px;line-height:1.6;margin-bottom:20px}
#enableGyro button{background:#55ff55;color:#000;border:4px solid #000;padding:20px 30px;font-family:'Press Start 2P';font-size:10px;box-shadow:6px 6px 0 #000;cursor:pointer}
.vr-toggle{position:fixed;bottom:20px;right:15px;z-index:50;background:#00ff88;color:#000;border:3px solid #000;padding:14px 20px;font-family:'Press Start 2P';font-size:9px;box-shadow:5px 5px 0 #000;cursor:pointer}
#vrOverlay{position:fixed;inset:0;display:none;z-index:200;background:#000}
#vrOverlay.on{display:flex}
.vr-eye{flex:1;border-right:2px solid #55ff55;display:flex;align-items:center;justify-content:center;flex-direction:column;transform:perspective(500px)}
</style>
</head>
<body>
<div id="os">
  <div class="topbar"><span>MCVR OS v1.1 • GYRO: <span id="gyroStatus">OFF</span></span><span id="clock">--:--</span><span>VR READY</span></div>
  <div class="app-grid">
    <div class="app"><div class="app-icon">💬</div><div class="app-label">CREEPER<br>CHAT</div></div>
    <div class="app"><div class="app-icon">🗂️</div><div class="app-label">MINE<br>EXPLORER</div></div>
    <div class="app"><div class="app-icon">🌐</div><div class="app-label">BLOCK<br>BROWSER</div></div>
    <div class="app"><div class="app-icon">🖼️</div><div class="app-label">GALLERY</div></div>
    <div class="app"><div class="app-icon">⛏️</div><div class="app-label">FORGE</div></div>
    <div class="app"><div class="app-icon">⚙️</div><div class="app-label">SETTINGS</div></div>
  </div>
</div>

<button class="vr-toggle" onclick="toggleVR()">🥽 ENTER VR</button>

<div id="enableGyro">
  <h1>MCVRCREEPER OS v1.1<br><br><span style="color:#aaffaa;font-size:8px">GYRO VR MODE</span></h1>
  <p style="font-family:Arial;font-size:14px;color:#ccffcc;margin-bottom:25px;line-height:1.5">Beweeg je telefoon rond om te kijken.<br>Dit is je VR OS zonder headset.</p>
  <button onclick="startGyro()">🟩 ACTIVEER GYRO + START OS</button>
  <p style="font-size:6px;margin-top:20px;color:#666">iPhone vraagt om toestemming - klik op STA TOE</p>
</div>

<div id="vrOverlay"><div class="vr-eye"><div class="app-icon">💬</div><p style="margin-top:10px;font-size:8px">LEFT</p></div><div class="vr-eye"><div class="app-icon">🌐</div><p style="margin-top:10px;font-size:8px">RIGHT</p><button onclick="toggleVR()" style="margin-top:20px;padding:10px;background:#55ff55;border:0;font-family:'Press Start 2P';font-size:8px">EXIT VR</button></div></div>

<script>
let gyroEnabled = false;
function startGyro(){
  // iOS 13+ needs permission
  if(typeof DeviceOrientationEvent.requestPermission === 'function'){
    DeviceOrientationEvent.requestPermission().then(res=>{
      if(res === 'granted') enableGyroNow();
    }).catch(()=>alert('Geef toestemming voor beweging'));
  } else {
    enableGyroNow();
  }
}
function enableGyroNow(){
  document.getElementById('enableGyro').style.display='none';
  document.getElementById('gyroStatus').textContent='ON';
  document.getElementById('gyroStatus').style.color='#00ff88';
  gyroEnabled = true;
  window.addEventListener('deviceorientation', handleGyro);
}
function handleGyro(e){
  if(!gyroEnabled) return;
  const x = e.gamma / 3; // left-right
  const y = e.beta / 4; // up-down, smaller = rustiger
  document.getElementById('os').style.transform = `rotateY(${x}deg) rotateX(${y-40}deg)`;
}
function toggleVR(){
  const ov = document.getElementById('vrOverlay');
  ov.classList.toggle('on');
  if(ov.classList.contains('on')){
    // In VR mode willen we 2x gyro effect
    document.querySelector('.vr-toggle').textContent = '❌ EXIT VR';
  } else {
    document.querySelector('.vr-toggle').textContent = '🥽 ENTER VR';
  }
}
setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString().slice(0,5)},1000);
</script>
</body>
</html>
