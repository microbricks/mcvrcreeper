<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SpaceOS VR - Microbricks</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070f1e;color:white;height:100vh;width:100vw;overflow:hidden;font-family:-apple-system, BlinkMacSystemFont, sans-serif;perspective:1200px}
#space{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 0.15s ease-out;display:flex;align-items:center;justify-content:center}
.panel{position:absolute;background:#161c28;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.8);overflow:hidden;transform-style:preserve-3d}
.panel-header{padding:14px 18px;font-size:18px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
#notities{width:260px;height:180px;left:18%;top:35%;transform:rotateY(25deg) rotateX(5deg);background:#1e1e1e}
#browser{width:380px;height:260px;left:50%;top:32%;transform:translateX(-50%) rotateX(8deg);background:#1a1d27;z-index:2}
#browser .panel-header{background:#1e1e1e;justify-content:center;font-size:22px}
#spotify{width:260px;height:180px;right:18%;top:35%;transform:rotateY(-25deg) rotateX(5deg);background:#121212}
#spotify .panel-header{color:#1DB954;font-style:italic}
.panel-content{padding:15px;height:calc(100% - 50px);overflow:auto}
#dock{position:absolute;bottom:12%;left:50%;transform:translateX(-50%) rotateX(25deg) translateZ(-100px);background:#1a1f2e;padding:14px 30px;border-radius:12px;display:flex;gap:22px;box-shadow:0 10px 40px rgba(0,0,0,0.6)}
.dot{width:26px;height:26px;border-radius:50%;cursor:pointer;transition:0.2s;box-shadow:inset 0 0 10px rgba(255,255,255,0.2)}
.dot:hover{transform:scale(1.3)} .dot.blue{background:#3b82f6} .dot.green{background:#22c55e} .dot.purple{background:#6366f1} .dot.yellow{background:#eab308} .dot.gray{background:#9ca3af}
#startScreen{position:fixed;inset:0;background:#070f1e;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#startScreen button{background:white;color:#070f1e;border:0;padding:18px 35px;border-radius:30px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:20px}
iframe{width:100%;height:100%;border:0;background:white;border-radius:0 0 12px 12px}
textarea{width:100%;height:100%;background:transparent;border:0;color:white;resize:none;outline:none;font-size:14px}
</style>
</head>
<body>
<div id="space">
  <div id="notities" class="panel"><div class="panel-header"><span>Notities</span><span style="opacity:0.5">⋯</span></div><div class="panel-content"><textarea placeholder="Typ hier je notities...&#10;&#10;🟩 MCVR Notes actief">🟩 MCVR OS - Ideas:
- Nieuwe VR world bouwen
- Creeper base upgraden
- SpaceOS fixen 💚</textarea></div></div>
  
  <div id="browser" class="panel"><div class="panel-header"><span>Browser</span></div><div class="panel-content" style="padding:0"><iframe src="https://microbricks.github.io" id="browserFrame"></iframe></div></div>
  
  <div id="spotify" class="panel"><div class="panel-header"><span>Spotify</span></div><div class="panel-content"><p style="opacity:0.6;font-size:13px">🎵 Nu speelt:</p><p style="margin-top:10px;font-weight:bold">MCVRCREEPER - VR Mix</p><p style="opacity:0.5;font-size:12px;margin-top:5px">SpaceOS VR • 3:42</p><div style="margin-top:20px;height:4px;background:#333;border-radius:2px"><div style="width:45%;height:100%;background:#1DB954;border-radius:2px"></div></div></div></div>

  <div id="dock"><div class="dot blue" onclick="focusPanel('notities')"></div><div class="dot green" onclick="focusPanel('browser')"></div><div class="dot purple" onclick="focusPanel('spotify')"></div><div class="dot yellow"></div><div class="dot gray" onclick="toggleVR()"></div></div>
</div>

<div id="startScreen">
  <h1 style="font-weight:300;letter-spacing:2px">SpaceOS VR</h1>
  <p style="opacity:0.6;margin-top:10px;font-size:14px">microbricks.github.io • Gyro Edition</p>
  <button onclick="start()">▶ START VR OS</button>
  <p style="opacity:0.4;font-size:11px;margin-top:15px">Beweeg je telefoon na start</p>
</div>

<script>
function start(){
  if(typeof DeviceOrientationEvent.requestPermission === 'function'){
    DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted') enable()}).catch(()=>enable());
  } else enable();
}
function enable(){
  document.getElementById('startScreen').style.display='none';
  window.addEventListener('deviceorientation', e=>{
    const x = (e.gamma || 0) / 2;
    const y = (e.beta || 0) / 4;
    document.getElementById('space').style.transform = `rotateY(${x}deg) rotateX(${y-50}deg)`;
  });
  // muis fallback voor PC
  window.addEventListener('mousemove', e=>{
    const x = (e.clientX / window.innerWidth - 0.5) * 30;
    const y = (e.clientY / window.innerHeight - 0.5) * -20;
    document.getElementById('space').style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
  });
}
function focusPanel(id){
  const p = document.getElementById(id);
  p.style.transform += ' translateZ(80px)';
  p.style.boxShadow = '0 30px 80px rgba(0,0,0,0.9), 0 0 0 2px #3b82f6';
  setTimeout(()=>{p.style.transform = p.style.transform.replace(' translateZ(80px)',''); p.style.boxShadow='0 20px 60px rgba(0,0,0,0.8)'}, 800);
}
function toggleVR(){
  if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
}
</script>
</body>
</html>
